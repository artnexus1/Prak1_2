<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сотрудник</title>
</head>
<body>

<h1 th:text="${employee.id} == null ? 'Добавить' : 'Редактировать'"></h1>

<form th:action="${employee.id} == null
                    ? @{/employees/add}
                    : @{/employees/edit/{id}(id=${employee.id})}"
      th:object="${employee}" method="post">

    <p>ФИО: <label>
        <input type="text" th:field="*{fullName}"/>
    </label>
        <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color:red"></span></p>

    <p>Email: <label>
        <input type="text" th:field="*{email}"/>
    </label>
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red"></span></p>

    <p>Телефон: <label>
        <input type="text" th:field="*{phone}"/>
    </label>
        <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color:red"></span></p>

    <p>Должность: <label>
        <input type="text" th:field="*{position}"/>
    </label>
        <span th:if="${#fields.hasErrors('position')}" th:errors="*{position}" style="color:red"></span></p>

    <p>Зарплата: <label>
        <input type="number" step="0.01" th:field="*{salary}"/>
    </label>
        <span th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}" style="color:red"></span></p>

    <p>Активен: <label>
        <input type="checkbox" th:field="*{active}"/>
    </label></p>

    <button type="submit">Сохранить</button>
    <a th:href="@{/employees}">Отмена</a>
</form>

</body>
</html>
